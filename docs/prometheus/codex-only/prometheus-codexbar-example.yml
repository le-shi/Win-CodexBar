global:
  scrape_interval: 1m
  evaluation_interval: 1m

rule_files:
  - /etc/prometheus/rules/codexbar-codex-alerts.yml

scrape_configs:
  - job_name: codex-bar
    scrape_interval: 5m
    scrape_timeout: 4m
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/codexbar.token
    # Keep exporter-wide health series and Codex provider series only.
    metric_relabel_configs:
      - source_labels: [provider]
        regex: '^(codex)?$'
        action: keep
    static_configs:
      - targets:
          - 192.168.13.111:8081
          - 192.168.13.241:8081
          - 192.168.13.184:8081
        labels:
          monitor: codexbar-codex
